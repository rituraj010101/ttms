services:
  db:
    image: mysql:8.4
    container_name: ttms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ttms
      MYSQL_USER: ttms_user
      MYSQL_PASSWORD: ttms_password
    ports:
      - "3306:3306"
    volumes:
      - ttms_mysqldata:/var/lib/mysql
      - ./db/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u ttms_user -pttms_password"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: ttms-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ttms_user
      MYSQL_PASSWORD: ttms_password
      MYSQL_DATABASE: ttms
      DATABASE_URL: mysql://ttms_user:ttms_password@db:3306/ttms
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: ttms-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  ttms_mysqldata:
