name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: ttms
          MYSQL_USER: ttms_user
          MYSQL_PASSWORD: ttms_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u ttms_user -pttms_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Load MySQL schema
        run: mysql -h 127.0.0.1 -P 3306 -u ttms_user -pttms_password ttms < db/mysql_schema.sql

      - name: Boot the API and check health
        working-directory: backend
        env:
          DATABASE_URL: mysql://ttms_user:ttms_password@127.0.0.1:3306/ttms
          PORT: 4000
        run: |
          node src/server.js &
          sleep 3
          curl --fail http://localhost:4000/api/health
